<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A1714">
<title>Trip Planner</title>
<style>
  :root {
    --bg: #1A1714;
    --bg-card: #242019;
    --bg-surface: #2C2820;
    --accent: #D8B978;
    --accent-dim: rgba(216,185,120,0.15);
    --text: #F7F4EE;
    --text-muted: #8C8070;
    --border: rgba(255,255,255,0.08);
    --success: #6DBF8A;
    --danger: #E06B6B;
    --radius: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 15px; overscroll-behavior: none; }

  /* ── TOPBAR ── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: calc(var(--safe-top) + 12px) 16px 12px;
    background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .topbar-back { background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; padding: 4px; line-height: 1; }
  .topbar-title { font-size: 17px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-sub { font-size: 12px; color: var(--text-muted); }
  .topbar-action { background: none; border: none; color: var(--accent); font-size: 14px; cursor: pointer; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }

  /* ── CONTENT ── */
  .screen { display: none; flex-direction: column; height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen.active { display: flex; }
  .content { padding: 70px 0 calc(var(--safe-bot) + 16px); flex: 1; }

  /* ── TRIPS LIST ── */
  .trip-card {
    margin: 12px 16px; padding: 16px; border-radius: var(--radius);
    background: var(--bg-card); border: 1px solid var(--border);
    cursor: pointer; active: opacity 0.7;
  }
  .trip-card:active { opacity: 0.7; }
  .trip-card-name { font-size: 18px; font-weight: 600; font-family: Georgia, serif; margin-bottom: 4px; }
  .trip-card-dest { font-size: 13px; color: var(--accent); margin-bottom: 8px; }
  .trip-card-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-confirmed { background: rgba(109,191,138,0.15); color: var(--success); border: 1px solid rgba(109,191,138,0.3); }
  .badge-planning { background: rgba(216,185,120,0.15); color: var(--accent); border: 1px solid rgba(216,185,120,0.3); }

  /* ── DAYS LIST ── */
  .day-header {
    padding: 10px 16px; font-size: 13px; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
    position: sticky; top: 56px; background: var(--bg); z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  .day-label-main { color: var(--text); font-size: 14px; }
  .day-label-sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

  /* ── EVENT ROW ── */
  .event-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .event-row:active { background: var(--bg-surface); }
  .event-icon { font-size: 20px; flex-shrink: 0; width: 28px; text-align: center; margin-top: 2px; }
  .event-body { flex: 1; min-width: 0; }
  .event-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .event-time { color: var(--accent); font-weight: 500; }
  .event-confirmed { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
  .confirmed-yes { background: var(--success); }
  .confirmed-no { background: var(--border); border: 1px solid var(--text-muted); }

  /* ── EVENT DETAIL MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7); display: flex; align-items: flex-end;
  }
  .modal-sheet {
    width: 100%; background: var(--bg-card); border-radius: 20px 20px 0 0;
    padding: 0 0 calc(var(--safe-bot) + 16px);
    max-height: 90vh; overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 16px; }
  .modal-title { font-size: 18px; font-weight: 600; padding: 0 20px 4px; }
  .modal-sub { font-size: 13px; color: var(--text-muted); padding: 0 20px 16px; }
  .modal-section { padding: 12px 20px; border-top: 1px solid var(--border); }
  .modal-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .modal-value { font-size: 14px; }

  /* ── FIELDS ── */
  .field-group { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; }
  .field-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .field-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px;
    outline: none; font-family: inherit;
  }
  .field-input:focus { border-color: var(--accent); }
  textarea.field-input { resize: none; min-height: 80px; }

  /* ── TOGGLE ── */
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--border); }
  .toggle-label { font-size: 14px; }
  .toggle { position: relative; width: 48px; height: 28px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--bg-surface); border-radius: 28px; transition: 0.2s; border: 1px solid var(--border); }
  .toggle-slider:before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: var(--text-muted); border-radius: 50%; transition: 0.2s; }
  input:checked + .toggle-slider { background: rgba(109,191,138,0.3); border-color: var(--success); }
  input:checked + .toggle-slider:before { transform: translateX(20px); background: var(--success); }

  /* ── BUTTONS ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; }
  .btn:active { opacity: 0.75; }
  .btn-primary { background: var(--accent); color: #1A1714; }
  .btn-ghost { background: var(--bg-surface); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: rgba(224,107,107,0.15); color: var(--danger); border: 1px solid rgba(224,107,107,0.3); }
  .btn-full { width: calc(100% - 32px); margin: 8px 16px; }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 60px 32px; color: var(--text-muted); }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-text { font-size: 15px; line-height: 1.5; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: calc(var(--safe-bot) + 80px); left: 50%; transform: translateX(-50%);
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 300;
    animation: fadeInOut 2.5s forwards; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  @keyframes fadeInOut { 0%,100%{opacity:0;transform:translateX(-50%) translateY(8px)} 15%,80%{opacity:1;transform:translateX(-50%) translateY(0)} }

  /* ── LOADING ── */
  .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-muted); font-size: 14px; }

  /* ── DOCS ── */
  .doc-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .doc-icon { font-size: 24px; flex-shrink: 0; }
  .doc-name { font-size: 14px; font-weight: 500; }
  .doc-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ── SECTION HEADER ── */
  .section-header { padding: 20px 16px 8px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

  /* ── MULTIDAY BADGE ── */
  .ev-multiday { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: rgba(216,185,120,0.15); color: var(--accent); border: 1px solid rgba(216,185,120,0.3); }
</style>
</head>
<body>

<!-- ══ SCREEN: TRIPS LIST ══ -->
<div id="screen-trips" class="screen active">
  <div class="topbar">
    <div>
      <div class="topbar-title">✈️ Trip Planner</div>
      <div class="topbar-sub" id="sync-label">Cargando...</div>
    </div>
    <button class="topbar-action" onclick="loadData()">↻ Actualizar</button>
  </div>
  <div class="content" id="trips-list"></div>
</div>

<!-- ══ SCREEN: TRIP DETAIL (días) ══ -->
<div id="screen-trip" class="screen">
  <div class="topbar">
    <button class="topbar-back" onclick="showScreen('trips')">‹</button>
    <div style="flex:1; min-width:0;">
      <div class="topbar-title" id="trip-title"></div>
      <div class="topbar-sub" id="trip-sub"></div>
    </div>
    <button class="topbar-action" onclick="showBudget()">💰</button>
    <button class="topbar-action" onclick="showDocs()">📄</button>
  </div>
  <div class="content" id="trip-days"></div>
</div>

<!-- ══ SCREEN: BUDGET ══ -->
<div id="screen-budget" class="screen">
  <div class="topbar">
    <button class="topbar-back" onclick="showScreen('trip')">‹</button>
    <div class="topbar-title">Gastos</div>
    <button class="topbar-action" onclick="showExpenseForm()">+ Agregar</button>
  </div>
  <div class="content" id="budget-content"></div>
</div>

<!-- ══ MODAL: ADD EXPENSE ══ -->
<div id="expense-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeExpenseModal()">
  <div class="modal-sheet" style="padding:20px">
    <div class="modal-handle"></div>
    <div style="font-size:16px;font-weight:600;margin-bottom:16px">Nuevo gasto</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      <div>
        <div class="field-label">Fecha</div>
        <input class="field-input" type="date" id="exp-date">
      </div>
      <div>
        <div class="field-label">Categoría</div>
        <select class="field-input" id="exp-category">
          <option value="vuelos">Vuelos</option>
          <option value="alojamiento">Alojamiento</option>
          <option value="traslados">Traslados</option>
          <option value="excursiones">Excursiones</option>
          <option value="restaurantes">Restaurantes</option>
          <option value="actividades">Actividades</option>
          <option value="compras">Compras</option>
          <option value="otros" selected>Otros</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:12px">
      <div class="field-label">Descripción</div>
      <input class="field-input" type="text" id="exp-description" placeholder="Ej: Souvenirs, propina...">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
      <div>
        <div class="field-label">Monto</div>
        <input class="field-input" type="number" id="exp-amount" min="0" step="0.01" placeholder="0.00">
      </div>
      <div>
        <div class="field-label">Moneda</div>
        <select class="field-input" id="exp-currency">
          <option>USD</option><option>EUR</option><option>ARS</option>
          <option>GBP</option><option>BRL</option><option>CLP</option>
          <option>MXN</option><option>COP</option><option>PEN</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:16px">
      <div class="field-label">Medio de pago</div>
      <select class="field-input" id="exp-payment-method">
        <option value="">— Sin especificar —</option>
        <option value="efectivo">Efectivo</option>
        <option value="debito">Débito</option>
        <option value="credito">Crédito</option>
        <option value="transferencia">Transferencia</option>
        <option value="crypto">Crypto</option>
      </select>
    </div>
    <input type="hidden" id="exp-editing-index">
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeExpenseModal()">Cancelar</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveExpense()">Guardar</button>
    </div>
  </div>
</div>

<!-- ══ SCREEN: DOCS ══ -->
<div id="screen-docs" class="screen">
  <div class="topbar">
    <button class="topbar-back" onclick="showScreen('trip')">‹</button>
    <div class="topbar-title">Documentos</div>
    <button class="topbar-action" onclick="triggerUpload()">+ Subir</button>
  </div>
  <div class="content" id="docs-list"></div>
  <input type="file" id="file-input" style="display:none" accept="*/*" onchange="handleUpload(this)">
</div>

<!-- ══ MODAL: EVENT DETAIL ══ -->
<div id="event-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet" id="event-sheet">
    <div class="modal-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
var state = {
  trips: [],
  activeTrip: null,
  changes: [],
  exportedAt: null
};

var EVENT_ICONS = {
  flight: '✈️', hotel: '🏨', car: '🚗', restaurant: '🍽️',
  activity: '🎯', excursion: '🗺️', transfer: '🚌', note: '📝'
};

var MONTH_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var DAY_NAMES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// ══════════════════════════════════════════════════
// SYNC — Firebase Realtime Database
// ══════════════════════════════════════════════════
var FB = "https://tripplanner-ea6fc-default-rtdb.firebaseio.com/yz4s3xmkvxis29p34p";

function loadData() {
  document.getElementById('sync-label').textContent = 'Actualizando...';
  fetch(FB + "/trip_data.json")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data) { document.getElementById('sync-label').textContent = 'Sin datos aún'; return; }
      state.trips = data.trips || [];
      state.exportedAt = data.exported_at;
      document.getElementById('sync-label').textContent = 'Actualizado ' + formatSyncTime(data.exported_at);
      renderTripsList();
    })
    .catch(function() {
      document.getElementById('sync-label').textContent = '❌ Sin conexión';
    });
}

function saveChangesLocal() {
  try {
    localStorage.setItem('tp_changes', JSON.stringify({ changes: state.changes }));
  } catch (e) {}
}

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
window.onload = function() {
  loadData();
};

// ══════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('screen-' + name).scrollTop = 0;
}

function showDocs() {
  renderDocs();
  showScreen('docs');
}

// ══════════════════════════════════════════════════
// TRIPS LIST
// ══════════════════════════════════════════════════
function renderTripsList() {
  var el = document.getElementById('trips-list');
  if (!state.trips.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🗺️</div><div class="empty-text">No hay viajes disponibles.</div></div>';
    return;
  }
  el.innerHTML = state.trips.map(function(trip, i) {
    var nights = countNights(trip.date_start, trip.date_end);
    var badgeClass = trip.status === 'confirmed' ? 'badge-confirmed' : 'badge-planning';
    var badgeLabel = trip.status === 'confirmed' ? 'Confirmado' : 'Planificando';
    return '<div class="trip-card" onclick="openTrip(' + i + ')">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">' +
        '<div class="trip-card-name">' + esc(trip.name) + '</div>' +
        '<span class="badge ' + badgeClass + '">' + badgeLabel + '</span>' +
      '</div>' +
      '<div class="trip-card-dest">📍 ' + esc(trip.destination) + '</div>' +
      '<div class="trip-card-meta">' +
        '<span>📅 ' + formatDateShort(trip.date_start) + ' → ' + formatDateShort(trip.date_end) + '</span>' +
        '<span>🌙 ' + nights + ' noches</span>' +
        '<span>👥 ' + (trip.travelers || 1) + ' pers.</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function openTrip(idx) {
  state.activeTrip = idx;
  var trip = state.trips[idx];
  document.getElementById('trip-title').textContent = trip.name;
  document.getElementById('trip-sub').textContent = trip.destination + ' · ' + formatDateShort(trip.date_start) + ' – ' + formatDateShort(trip.date_end);
  renderDays();
  showScreen('trip');
}

// ══════════════════════════════════════════════════
// DAYS + EVENTS
// ══════════════════════════════════════════════════
function renderDays() {
  var trip = state.trips[state.activeTrip];
  var el = document.getElementById('trip-days');
  if (!trip.days || !trip.days.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">Sin días cargados.</div></div>';
    return;
  }

  var html = '';
  trip.days.forEach(function(day) {
    var dateObj = day.date ? new Date(day.date + 'T12:00:00') : null;
    var dateStr = dateObj ? (DAY_NAMES[dateObj.getDay()] + ' ' + dateObj.getDate() + ' ' + MONTH_SHORT[dateObj.getMonth()]) : '';
    var eventsHtml = '';

    // Filtrar eventos: no mostrar continuaciones multiday (solo el primero)
    var events = (day.events || []).filter(function(e) { return !e._continuation; });

    if (!events.length) {
      eventsHtml = '<div style="padding:14px 16px;font-size:13px;color:var(--text-muted);font-style:italic">Sin eventos</div>';
    } else {
      events.forEach(function(ev) {
        var extra = {};
        try { extra = typeof ev.extra_json === 'string' ? JSON.parse(ev.extra_json) : (ev.extra_json || {}); } catch(e){}
        var icon = EVENT_ICONS[ev.type] || '📌';
        var meta = [];
        if (ev.time_start) meta.push('<span class="event-time">' + ev.time_start + (ev.time_end ? '–'+ev.time_end : '') + '</span>');
        if (ev.location) meta.push(esc(ev.location));
        if (ev.cost > 0) meta.push(ev.cost + ' ' + (ev.currency || ''));
        // Info específica por tipo
        if (ev.type === 'flight' && extra.flight_number) meta.push(extra.flight_number);
        if (ev.type === 'hotel' && extra.check_in) meta.push('Check-in ' + extra.check_in);
        if (ev.type === 'restaurant' && extra.cuisine) meta.push(extra.cuisine);

        var multiday = ev.date_end && ev.date_end !== day.date ? '<span class="ev-multiday">hasta ' + formatDateShort(ev.date_end) + '</span>' : '';

        eventsHtml += '<div class="event-row" onclick="openEvent(\'' + day.id + '\',\'' + ev.id + '\')">' +
          '<div class="event-icon">' + icon + '</div>' +
          '<div class="event-body">' +
            '<div class="event-title">' + esc(ev.title || ev.type) + ' ' + multiday + '</div>' +
            (meta.length ? '<div class="event-meta">' + meta.join('<span style="opacity:0.3">·</span>') + '</div>' : '') +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:4px;align-items:center">' +
            '<div class="event-confirmed ' + (ev.confirmed ? 'confirmed-yes' : 'confirmed-no') + '" title="' + (ev.confirmed ? 'Confirmado' : 'Sin confirmar') + '"></div>' +
            (ev.paid ? '<div style="width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0" title="Pagado"></div>' : '<div style="width:8px;height:8px;flex-shrink:0"></div>') +
          '</div>' +
        '</div>';
      });
    }

    // Notas del día
    var notesHtml = '<div style="padding:10px 16px 14px">' +
      '<input class="field-input" style="font-size:13px;padding:8px 12px" placeholder="Notas del día..." ' +
        'value="' + esc(day.notes || '') + '" ' +
        'onchange="updateDayNotes(' + day.id + ',this.value)">' +
    '</div>';

    html += '<div>' +
      '<div class="day-header">' +
        '<div class="day-label-main">Día ' + day.day_num + (dateStr ? ' — ' + dateStr : '') + '</div>' +
      '</div>' +
      eventsHtml +
      notesHtml +
    '</div>';
  });

  el.innerHTML = html;
}

// ══════════════════════════════════════════════════
// EVENT DETAIL
// ══════════════════════════════════════════════════
function mapsUrl(location) {
  if (!location) return null;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(location);
}

function infoRow(label, value) {
  if (!value) return '';
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)">' +

}

function openEvent(dayId, eventId) {

      (ev.time_start ? '<div style="font-size:13px;color:var(--accent);margin-top:4px">🕐 ' + ev.time_start + (ev.time_end ? ' – ' + ev.time_end : '') + '</div>' : '') +

      (ev.confirmed ? '<span style="color:var(--success);font-size:18px" title="Confirmado">✓</span>' : '<span style="color:var(--text-muted);font-size:18px" title="Sin confirmar">○</span>') +
      (ev.paid ? '<span style="color:var(--accent);font-size:11px;font-weight:600;background:var(--accent-dim);padding:2px 6px;border-radius:10px">PAGADO</span>' : '') +

        'style="display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;color:var(--text);text-decoration:none;font-size:14px;font-weight:500">' +

    '</div>';

    infoHtml += infoRow('Vuelo', extra.flight_number);
    infoHtml += infoRow('Ruta', extra.origin && extra.destination_field ? extra.origin + ' → ' + extra.destination_field : null);
    infoHtml += infoRow('Terminal salida', extra.terminal);
    infoHtml += infoRow('Asiento', extra.seat);
    infoHtml += infoRow('Confirmación', extra.confirmation_num);
    if (extra.legs) {
      try {
        var legs = typeof extra.legs === 'string' ? JSON.parse(extra.legs) : extra.legs;
        if (legs.length > 1) {
          infoHtml += '<div style="padding:8px 0"><div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">TRAMOS</div>';
          legs.forEach(function(leg, i) {

            '</div>';

  if (ev.type === 'hotel') {
    infoHtml += infoRow('Habitación', extra.room_type);
    infoHtml += infoRow('Check-in', extra.check_in ? extra.check_in + (extra.check_in_time ? ' ' + extra.check_in_time : '') : null);
    infoHtml += infoRow('Check-out', extra.check_out ? extra.check_out + (extra.check_out_time ? ' ' + extra.check_out_time : '') : null);
    infoHtml += infoRow('Confirmación', extra.confirmation_num);
    infoHtml += infoRow('Teléfono', extra.phone_hotel);
    infoHtml += infoRow('Web', extra.website);
  }

  if (ev.type === 'restaurant') {
    infoHtml += infoRow('Cocina', extra.cuisine);
    infoHtml += infoRow('Reserva a nombre de', extra.reservation_name);
    infoHtml += infoRow('Nro. reserva', extra.reservation_num);
    infoHtml += infoRow('Teléfono', extra.phone);
    infoHtml += infoRow('Web', extra.website);

  if (ev.type === 'activity' || ev.type === 'excursion') {
    infoHtml += infoRow('Punto de encuentro', extra.meeting_point);
    infoHtml += infoRow('Retiro', extra.pickup_location);
    infoHtml += infoRow('Guía', extra.guide_name);
    infoHtml += infoRow('Grupo', extra.group_size ? extra.group_size + ' personas' : null);
    infoHtml += infoRow('Incluye', extra.included);

    infoHtml += infoRow('Empresa', extra.company);
    infoHtml += infoRow('Vehículo', extra.vehicle);

  html += '<div style="padding:4px 20px 0;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:8px">Editar</div>';
  html += '<div class="field-group">' +

  html += '<div class="toggle-row">' +
    '<span class="toggle-label">Pagado</span>' +
    '<label class="toggle"><input type="checkbox" id="ef-paid" ' + (ev.paid ? 'checked' : '') + '>' +
    '<span class="toggle-slider"></span></label>' +

  // ── Documentos del evento ──

    html += '<div style="padding:0 16px 8px">';
    evDocs.forEach(function(doc) {
      var ext = (doc.original_name || '').split('.').pop().toLowerCase();
      var icon = ext === 'pdf' ? '📕' : ['jpg','jpeg','png','webp'].includes(ext) ? '🖼️' : '📄';
      var dlBtn = '';
      if (doc.base64_data) {
        var mime = doc.file_type || 'application/octet-stream';
        var fname = esc(doc.original_name || 'documento');
        dlBtn = ' <a href="data:' + mime + ';base64,' + doc.base64_data + '" download="' + fname + '" ' +
          'style="padding:4px 10px;background:var(--accent);color:#fff;border-radius:6px;text-decoration:none;font-size:12px">⬇ Bajar</a>';
      }

        '<span style="font-size:18px">' + icon + '</span>' +
        '<span style="flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(doc.original_name || 'Documento') + '</span>' +
        dlBtn +
      '</div>';
    });
    html += '</div>';
  }

  html += '<div style="padding:16px 16px 4px;display:flex;gap:10px">' +
    '<button class="btn btn-primary" style="flex:1" onclick="saveEventChanges(\'' + ev.id + '\')">Guardar cambios</button>' +
    '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
  '</div>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('event-modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('event-modal').style.display = 'none';
}

function saveEventChanges(eventId) {
  var fields = {
    time_start: document.getElementById('ef-time_start').value,
    time_end:   document.getElementById('ef-time_end').value,
    notes:      document.getElementById('ef-notes').value,
    confirmed:  document.getElementById('ef-confirmed').checked ? 1 : 0,
    paid:       document.getElementById('ef-paid').checked ? 1 : 0
  };

  // Actualizar en estado local
  var trip = state.trips[state.activeTrip];
  trip.days.forEach(function(day) {
    (day.events || []).forEach(function(ev) {
      if (String(ev.id) === String(eventId)) {
        ev.time_start = fields.time_start;
        ev.time_end = fields.time_end;
        ev.notes = fields.notes;
        ev.confirmed = fields.confirmed;
        ev.paid = fields.paid;
      }
    });
  });

  // Agregar al queue de cambios
  state.changes.push({ action: 'update_event', id: parseInt(eventId), fields: fields });
  saveChanges();
  closeModal();
  renderDays();
  showToast('Cambio guardado ✓');
}

function updateDayNotes(dayId, notes) {
  state.changes.push({ action: 'update_day_notes', day_id: parseInt(dayId), notes: notes });
  saveChanges();
}

function renderDocs() {
  var trip = state.trips[state.activeTrip];
  var el = document.getElementById('docs-list');
  var docs = trip.documents || [];

  if (!docs.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📄</div><div class="empty-text">Sin documentos.<br>Usá el botón + para subir uno.</div></div>';
    return;
  }

  el.innerHTML = docs.map(function(doc) {
    var ext = (doc.filename || doc.original_name || '').split('.').pop().toLowerCase();
    var icon = ext === 'pdf' ? '📕' : ['jpg','jpeg','png','webp'].includes(ext) ? '🖼️' : '📄';
    var size = doc.file_size ? formatSize(doc.file_size) : '';
    var dlBtn = '';
    if (doc.base64_data) {
      var mime = doc.file_type || 'application/octet-stream';
      var fname = esc(doc.original_name || doc.filename || 'documento');
      dlBtn = '<a href="data:' + mime + ';base64,' + doc.base64_data + '" download="' + fname + '" ' +
        'style="padding:6px 12px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;font-size:12px;white-space:nowrap">⬇ Bajar</a>';
    }
    return '<div class="doc-row">' +
      '<div class="doc-icon">' + icon + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="doc-name">' + esc(doc.original_name || doc.filename || 'Documento') + '</div>' +
        '<div class="doc-meta">' + size + (doc.notes ? ' · ' + esc(doc.notes) : '') + '</div>' +
      '</div>' +
      dlBtn +
    '</div>';
  }).join('');
}

function triggerUpload() {
  document.getElementById('file-input').click();
}

function handleUpload(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var b64 = e.target.result.split(',')[1];
    var trip = state.trips[state.activeTrip];
    state.changes.push({
      action: 'upload_document',
      trip_id: trip.id,
      original_name: file.name,
      file_type: file.type,
      base64_data: b64
    });
    // Agregar al estado local para preview inmediato
    trip.documents = trip.documents || [];
    trip.documents.push({ original_name: file.name, file_type: file.type, file_size: file.size });
    saveChanges();
    renderDocs();
    showToast('Documento guardado ✓ — se subirá al sincronizar');
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function saveChanges() {
  var change = state.changes[state.changes.length - 1];
  if (!change) return;
  saveChangesLocal();  // backup local por las dudas
  fetch(FB + "/changes.json", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(change)
  })
  .then(function() { showToast('Guardado ✓'); })
  .catch(function() { showToast('Sin conexión — se guardó local'); });
}

function writeChangesFile(payload) {
  saveChangesLocal();
}

// UTILS

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDateShort(iso) {
  if (!iso) return '';
  var d = new Date(iso + 'T12:00:00');
  return d.getDate() + ' ' + MONTH_SHORT[d.getMonth()] + ' ' + d.getFullYear();
}

function formatSyncTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  var now = new Date();
  var diff = Math.round((now - d) / 60000);
  if (diff < 1) return 'ahora';
  if (diff < 60) return 'hace ' + diff + 'min';
  if (diff < 1440) return 'hace ' + Math.round(diff/60) + 'h';
  return 'hace ' + Math.round(diff/1440) + 'd';
}

function countNights(start, end) {
  if (!start || !end) return 0;
  return Math.round((new Date(end) - new Date(start)) / 86400000);
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

var CAT_COLORS = { vuelos:'#5b9bd5', alojamiento:'#ed7d31', traslados:'#a5a5a5', excursiones:'#70ad47', restaurantes:'#ffc000', actividades:'#9b59b6', compras:'#e74c3c', otros:'#556b7d' };
var CAT_ICONS  = { vuelos:'✈️', alojamiento:'🏨', traslados:'🚗', excursiones:'🏔️', restaurantes:'🍽️', actividades:'🎭', compras:'🛍️', otros:'💸' };

function showBudget() {
  renderBudget();
  showScreen('budget');
}

function renderBudget() {
  var trip = state.trips[state.activeTrip];
  if (!trip) return;
  var el = document.getElementById('budget-content');
  var expenses = trip.extra_expenses || [];
  var baseCurrency = (trip.budget && trip.budget.base_currency) || 'USD';
  var totalBudget = (trip.budget && trip.budget.total_budget) || 0;
  var rates = trip.fx_rates || [];

  function toBase(amount, currency) {
    if (currency === baseCurrency) return amount;
    var r = rates.find(function(x) { return x.from_currency === currency; });
    return r ? amount / r.rate : amount;
  }

  var catTotals = {};
  (trip.days || []).forEach(function(day) {
    (day.events || []).forEach(function(ev) {
      if (ev._multiday_label || ev._continuation || !ev.cost || !ev.paid) return;
      var cat = ev.type === 'flight' ? 'vuelos' : ev.type === 'hotel' ? 'alojamiento' :
        ev.type === 'transfer' || ev.type === 'car' ? 'traslados' :
        ev.type === 'excursion' ? 'excursiones' : ev.type === 'restaurant' ? 'restaurantes' :
        ev.type === 'activity' ? 'actividades' : 'otros';
      catTotals[cat] = (catTotals[cat] || 0) + toBase(ev.cost, ev.currency || baseCurrency);
    });
  });
  expenses.forEach(function(ex) {
    catTotals[ex.category] = (catTotals[ex.category] || 0) + toBase(ex.amount, ex.currency);
  });

  // Estimado: todos los eventos con costo
  var totalEstimado = 0;
  (trip.days || []).forEach(function(day) {
    (day.events || []).forEach(function(ev) {
      if (ev._multiday_label || ev._continuation || !ev.cost) return;
      totalEstimado += toBase(ev.cost, ev.currency || baseCurrency);
    });
  });
  (trip.extra_expenses || []).forEach(function(ex) {
    totalEstimado += toBase(ex.amount, ex.currency);
  });

  // Gastado: eventos paid + gastos adicionales
  var totalGastado = 0;
  (trip.days || []).forEach(function(day) {
    (day.events || []).forEach(function(ev) {
      if (ev._multiday_label || ev._continuation || !ev.cost || !ev.paid) return;
      totalGastado += toBase(ev.cost, ev.currency || baseCurrency);
    });
  });
  (trip.extra_expenses || []).forEach(function(ex) {
    totalGastado += toBase(ex.amount, ex.currency);
  });

  var disponible = totalBudget > 0 ? totalBudget - totalGastado : null;
  var over = disponible !== null && disponible < 0;
  var pct = totalBudget > 0 ? Math.min(100, Math.round(totalGastado / totalBudget * 100)) : 0;

  var html = '';

  html += '<div class="card" style="margin-bottom:12px">';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">';
  html += '<div style="background:var(--bg);border-radius:10px;padding:12px"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">ESTIMADO</div>' +
    '<div style="font-size:18px;font-weight:600">' + totalEstimado.toFixed(0) + ' ' + baseCurrency + '</div></div>';
  html += '<div style="background:var(--bg);border-radius:10px;padding:12px"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">PRESUPUESTO</div>' +
    '<div style="font-size:18px;font-weight:600">' + (totalBudget > 0 ? totalBudget.toFixed(0) + ' ' + baseCurrency : '—') + '</div></div>';
  html += '<div style="background:var(--bg);border-radius:10px;padding:12px"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">GASTADO</div>' +
    '<div style="font-size:18px;font-weight:600;color:' + (over ? 'var(--danger)' : 'var(--text)') + '">' + totalGastado.toFixed(0) + ' ' + baseCurrency + '</div></div>';
  html += '<div style="background:var(--bg);border-radius:10px;padding:12px"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">DISPONIBLE</div>' +
    '<div style="font-size:18px;font-weight:600;color:' + (disponible === null ? 'var(--text-muted)' : over ? 'var(--danger)' : 'var(--success)') + '">' +
    (disponible === null ? '—' : disponible.toFixed(0) + ' ' + baseCurrency) + '</div></div>';
  html += '</div>';
  if (totalBudget > 0) {
    html += '<div style="display:flex;align-items:center;gap:8px">' +
      '<div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden">' +
        '<div style="width:' + pct + '%;height:100%;background:' + (over ? 'var(--danger)' : pct > 80 ? 'var(--accent)' : 'var(--success)') + ';border-radius:4px"></div>' +
      '</div><span style="font-size:12px;color:' + (over ? 'var(--danger)' : 'var(--text-muted)') + '">' + pct + '%</span></div>';
  }
  html += '</div>';

  var totalCatSum = Object.values(catTotals).reduce(function(a,b){return a+b;},0);
  var cats = Object.keys(catTotals).filter(function(c) { return catTotals[c] > 0; });
  if (cats.length) {
    html += '<div class="card" style="margin-bottom:12px"><div style="font-weight:600;font-size:14px;margin-bottom:12px">Por categoría (gastado)</div>';
    cats.forEach(function(cat) {
      var pctCat = totalCatSum > 0 ? Math.round(catTotals[cat] / totalCatSum * 100) : 0;
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">' +
        '<span style="font-size:18px">' + (CAT_ICONS[cat] || '💸') + '</span>' +
        '<div style="flex:1">' +
          '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">' +
            '<span style="text-transform:capitalize">' + cat + '</span>' +
            '<span style="font-weight:500">' + catTotals[cat].toFixed(0) + ' ' + baseCurrency + '</span>' +
          '</div>' +
          '<div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden">' +
            '<div style="width:' + pctCat + '%;height:100%;background:' + (CAT_COLORS[cat] || '#556b7d') + ';border-radius:3px"></div>' +
          '</div>' +
        '</div>' +
        '<span style="font-size:12px;color:var(--text-muted);min-width:32px;text-align:right">' + pctCat + '%</span>' +
      '</div>';
    });
    html += '</div>';
  }

  html += '<div class="card"><div style="font-weight:600;font-size:14px;margin-bottom:12px">Gastos adicionales</div>';
  if (!expenses.length) {
    html += '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:12px 0">Sin gastos adicionales</div>';
  } else {
    expenses.forEach(function(ex, idx) {
      var pmLabel = ex.payment_method ? ' · ' + ex.payment_method : '';
      html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">' +
        '<span style="font-size:18px">' + (CAT_ICONS[ex.category] || '💸') + '</span>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:14px">' + esc(ex.description || ex.category) + '</div>' +
          '<div style="font-size:12px;color:var(--text-muted)">' + (ex.date || '') + ' · ' + ex.category + pmLabel + '</div>' +
        '</div>' +
        '<span style="font-weight:600;font-size:14px;white-space:nowrap;margin-right:8px">' + ex.amount + ' ' + ex.currency + '</span>' +
        '<button onclick="showExpenseForm(' + idx + ')" style="background:none;border:none;color:var(--accent);font-size:16px;cursor:pointer;padding:4px">✎</button>' +
      '</div>';
    });
  }
  html += '</div>';

  el.innerHTML = html;
}

function showExpenseForm(editIndex) {
  var trip = state.trips[state.activeTrip];
  document.getElementById('exp-editing-index').value = editIndex !== undefined ? editIndex : '';
  if (editIndex !== undefined) {
    var ex = trip.extra_expenses[editIndex];
    document.getElementById('exp-date').value = ex.date || '';
    document.getElementById('exp-category').value = ex.category || 'otros';
    document.getElementById('exp-description').value = ex.description || '';
    document.getElementById('exp-amount').value = ex.amount || '';
    document.getElementById('exp-currency').value = ex.currency || 'USD';
    document.getElementById('exp-payment-method').value = ex.payment_method || '';
    document.querySelector('#expense-modal .modal-sheet div[style*="font-size:16px"]').textContent = 'Editar gasto';
  } else {
    var today = new Date().toISOString().split('T')[0];
    document.getElementById('exp-date').value = today;
    document.getElementById('exp-amount').value = '';
    document.getElementById('exp-description').value = '';
    document.getElementById('exp-payment-method').value = '';
    document.querySelector('#expense-modal .modal-sheet div[style*="font-size:16px"]').textContent = 'Nuevo gasto';
  }
  document.getElementById('expense-modal').style.display = 'flex';
}

function closeExpenseModal() {
  document.getElementById('expense-modal').style.display = 'none';
}

function saveExpense() {
  var trip = state.trips[state.activeTrip];
  var editIndex = document.getElementById('exp-editing-index').value;
  var data = {
    trip_id: trip.id,
    date: document.getElementById('exp-date').value,
    category: document.getElementById('exp-category').value,
    description: document.getElementById('exp-description').value,
    amount: parseFloat(document.getElementById('exp-amount').value) || 0,
    currency: document.getElementById('exp-currency').value,
    payment_method: document.getElementById('exp-payment-method').value
  };
  if (!trip.extra_expenses) trip.extra_expenses = [];
  if (editIndex !== '') {
    trip.extra_expenses[parseInt(editIndex)] = Object.assign(trip.extra_expenses[parseInt(editIndex)], data);
  } else {
    var change = { action: 'add_extra_expense', data: data };
    state.changes.push(change);
    trip.extra_expenses.push(data);
  }
  closeExpenseModal();
  renderBudget();
  saveChanges();
}

function showToast(msg) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2600);
}
</script>

</body>
</html>
